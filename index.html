<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
/* ===== Body & Centering ===== */
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f5f5f5;
  font-family: Arial, sans-serif;
}

/* ===== Calculator Container ===== */
.calculator {
  background-color: #222;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  width: 260px;
}

/* ===== Display ===== */
.display {
  background-color: #000;
  color: #0f0;
  font-size: 2rem;
  padding: 15px;
  border-radius: 5px;
  text-align: right;
  margin-bottom: 15px;
  overflow-x: auto;
}

/* ===== Buttons Grid ===== */
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

/* ===== Button Styles ===== */
.btn {
  padding: 20px;
  font-size: 1.2rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.2s;
}

/* Number Buttons */
.number {
  background-color: silver;
  color: #000;
}
.number:hover {
  background-color: #b0b0b0;
}

/* Operator Buttons */
.operator {
  background-color: silver;
  color: #000;
}
.operator:hover {
  background-color: #b0b0b0;
}

/* Equals Button */
.equals {
  background-color: silver;
  color: #000;
  grid-row: span 3; /* make equals taller */
}
.equals:hover {
  background-color: #b0b0b0;
}

/* Clear Button */
.clear {
  background-color: silver;
  color: #000;
}
.clear:hover {
  background-color: #b0b0b0;
}

/* Zero Button spans 2 columns */
.zero {
  grid-column: span 2;
}
</style>
</head>
<body>
<div class="calculator">
  <!-- Display -->
  <div class="display" id="display"></div>

  <!-- Buttons grid -->
  <div class="buttons">
    <!-- Row 1 -->
    <button class="btn clear" id="clear">C</button>
    <button class="btn clear" id="clearonce">CE</button>
    <button class="btn operator" data-operator="/">/</button>
    <button class="btn operator" data-operator="*">*</button>
    <button class="btn operator" data-operator="-">-</button>
    <!-- Row 2 -->
    <button class="btn number" data-number="7">7</button>
    <button class="btn number" data-number="8">8</button>
    <button class="btn number" data-number="9">9</button>
    <button class="btn operator" data-operator="+">+</button>
    <!-- Row 3 -->
    <button class="btn number" data-number="4">4</button>
    <button class="btn number" data-number="5">5</button>
    <button class="btn number" data-number="6">6</button>
    <button class="btn equals" id="equals">=</button>
    <!-- Row 4 -->
    <button class="btn number" data-number="1">1</button>
    <button class="btn number" data-number="2">2</button>
    <button class="btn number" data-number="3">3</button>
    <!-- Row 5 -->
    <button class="btn number zero" data-number="0">0</button>
    <button class="btn number" data-number=".">.</button>
  </div>
</div>

<script>
const display = document.querySelector(".display");
const numbers = document.querySelectorAll("[data-number]");
const operators = document.querySelectorAll("[data-operator]");
const equals = document.querySelector(".equals");
const clear = document.querySelector(".clear");
const backspace = document.getElementById("clearonce");

// ===== STATE (single source of truth) =====
let currentInput = "";
let previousInput = "";
let operator = null;

// ===== HELPERS =====
function updateDisplay() {
  display.textContent =
    previousInput +
    (operator ? operator : "") +
    currentInput;
}

function calculate() {
  if (previousInput === "" || currentInput === "" || !operator) return null;
  const prev = Number(previousInput);
  const curr = Number(currentInput);
  if (operator === "+") return prev + curr;
  if (operator === "-") return prev - curr;
  if (operator === "*") return prev * curr;
  if (operator === "/") return curr === 0 ? "Error" : prev / curr;
  return null;
}

// ===== NUMBER INPUT =====
numbers.forEach(btn => {
  btn.addEventListener("click", () => {
    const value = btn.dataset.number;
    // prevent multiple decimals
    if (value === "." && currentInput.includes(".")) return;
    currentInput += value;
    updateDisplay();
  });
});

// ===== OPERATOR INPUT =====
operators.forEach(btn => {
  btn.addEventListener("click", () => {
    const newOperator = btn.dataset.operator;

    // Case 1: operator change (5 + → 5 -)
    if (currentInput === "" && operator) {
      operator = newOperator;
      updateDisplay();
      return;
    }

    // Case 2: chaining (5 + 3 +)
    if (previousInput !== "" && currentInput !== "") {
      const result = calculate();
      if (result === "Error") {
        display.textContent = "Error";
        resetState();
        return;
      }
      previousInput = String(result);
      currentInput = "";
      operator = newOperator;
      updateDisplay();
      return;
    }

    // Case 3: first operator
    if (currentInput !== "") {
      previousInput = currentInput;
      currentInput = "";
      operator = newOperator;
      updateDisplay();
    }
  });
});

// ===== EQUALS =====
equals.addEventListener("click", () => {
  const result = calculate();
  if (result === null) return;
  display.textContent = result;
  currentInput = String(result);
  previousInput = "";
  operator = null;
});

// ===== CLEAR =====
clear.addEventListener("click", () => {
  resetState();
  updateDisplay();
});

function resetState() {
  currentInput = "";
  previousInput = "";
  operator = null;
}

// ===== BACKSPACE =====
backspace.addEventListener("click", () => {
  if (currentInput !== "") {
    currentInput = currentInput.slice(0, -1);
  } else if (operator) {
    operator = null;
  } else if (previousInput !== "") {
    previousInput = previousInput.slice(0, -1);
  }
  updateDisplay();
});
</script>
</body>
</html>
